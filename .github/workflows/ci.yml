name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: transitops_ci
          POSTGRES_USER: transitops
          POSTGRES_PASSWORD: transitops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transitops -d transitops_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=transitops_ci;Username=transitops;Password=transitops_ci
      Jwt__SigningKey: transitops-ci-signing-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore TransitOps.slnx
      - run: dotnet build TransitOps.slnx --configuration Release --no-restore
      - run: dotnet test TransitOps.slnx --configuration Release --no-build
      - run: dotnet tool restore
      - run: dotnet run --project TransitOps.Api --configuration Release --no-build -- --migrate-only

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: transitops_e2e
      POSTGRES_USER: transitops
      POSTGRES_PASSWORD: transitops_e2e
      POSTGRES_PORT: 5433
      JWT_SIGNING_KEY: transitops-e2e-signing-key-with-at-least-32-characters
      BOOTSTRAP_TOKEN: transitops-bootstrap-local-only
      E2E_BOOTSTRAP_TOKEN: transitops-bootstrap-local-only
      E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: docker compose up --build --detach
      - name: Esperar a la aplicación
        run: |
          timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null && curl --fail --silent http://127.0.0.1:5173 >/dev/null; do sleep 2; done'
      - working-directory: frontend
        run: npm run test:e2e
      - name: Diagnóstico del stack
        if: failure()
        run: docker compose logs --no-color
      - name: Trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
      - if: always()
        run: docker compose down --volumes

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: transitops-api
            dockerfile: TransitOps.Api/Dockerfile
          - image: transitops-web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/pey-45/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/pey-45/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
