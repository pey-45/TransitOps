name: transitops

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - transitops-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Define POSTGRES_USER in .env} -d ${POSTGRES_DB:?Define POSTGRES_DB in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: ${IMAGE_REPOSITORY:-ghcr.io/pey-45}/transitops-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:?Define POSTGRES_DB in .env};Username=${POSTGRES_USER:?Define POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Define JWT_SIGNING_KEY in .env}
      Bootstrap__FirstAdminToken: ${BOOTSTRAP_TOKEN:?Define BOOTSTRAP_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${IMAGE_REPOSITORY:-ghcr.io/pey-45}/transitops-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      web:
        condition: service_healthy

volumes:
  transitops-data:
